<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h2 class="text-center mb-4">Dashboard</h2>
    <div class="table-responsive shadow p-3 bg-white rounded">
        <table class="table table-striped table-hover">
            <thead class="table-dark text-center">
                <tr>
                    <th>#</th>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Abstract</th>
                    <th>Frontend IP</th>
                    <th>Backend IP</th>
                    <th>GitHub URL</th>
                </tr>
            </thead>
            <tbody th:each="entry, iterStat : ${entries}">
                <tr class="text-center">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${entry.rollNo}"></td>
                    <td th:text="${entry.name}"></td>
                    <td th:text="${entry.abstractText}"></td>
                    <td th:text="${entry.frontendIp}"></td>
                    <td th:text="${entry.backendIp}"></td>
                    <td>
                        <a th:href="${entry.githubUrl}" th:text="${entry.githubUrl}" target="_blank"></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
